server:
  name: "SafeLine MCP Server"
  version: "2.0.0"
  # LISTEN_ADDRESS and LISTEN_PORT can override these listener values.
  host: "127.0.0.1"
  port: 5678

logger:
  level: "info"
  file_path: ""
  console: true
  caller: false
  development: false

# SafeLine API Tokens remain administrator credentials in this release. Keep
# one token file per instance; the MCP server never returns them to clients.
instances:
  - id: "safeline-a"
    display_name: "SafeLine A"
    base_url: "https://safeline-a.example:9443"
    token_file: "/run/secrets/safeline-a.token"
    timeout: 30
    debug: false
    # Leave TLS verification enabled: the SafeLine API Token is an
    # administrator credential and disabling verification lets anyone on the
    # path read it. Set this to true only for a lab instance with an
    # unchangeable self-signed certificate.
    insecure_skip_verify: false

  - id: "safeline-b"
    display_name: "SafeLine B"
    base_url: "https://safeline-b.example:9443"
    token_file: "/run/secrets/safeline-b.token"
    timeout: 30
    debug: false
    insecure_skip_verify: false
