server:
  name: "SafeLine MCP Server"
  version: "2.0.0"
  # LISTEN_ADDRESS and LISTEN_PORT can override these listener values.
  host: "127.0.0.1"
  port: 5678
  # Required when host is not loopback. MCP_TLS_CERT / MCP_TLS_KEY override these.
  tls_cert_file: ""
  tls_key_file: ""

logger:
  level: "info"
  file_path: ""
  console: true
  caller: false
  development: false

# SafeLine API Tokens remain administrator credentials in this release. Keep
# one token file per instance; the MCP server never returns them to clients.
instances:
  - id: "safeline-a"
    display_name: "SafeLine A"
    base_url: "https://safeline-a.example:9443"
    token_file: "/run/secrets/safeline-a.token"
    timeout: 30
    debug: false
    # ca_file is the certificate authority that signed the certificate of the
    # instance. A SafeLine console serves the certificate it generated for
    # itself, which no public authority signed: point this at that certificate
    # (or at its CA) instead of switching the check off.
    ca_file: ""
  - id: "safeline-b"
    display_name: "SafeLine B"
    base_url: "https://safeline-b.example:9443"
    token_file: "/run/secrets/safeline-b.token"
    timeout: 30
    debug: false
    ca_file: ""
