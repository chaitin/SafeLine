name: Bug
description: Report a bug
title: "[Bug] "

body:
  - type: markdown
    attributes:
      value: |
        Please search the [open issues](https://github.com/chaitin/SafeLine/issues) and [discussion](https://github.com/chaitin/SafeLine/discussions) for duplicate issue first. 

  - type: input
    id: version
    attributes:
      label: SafeLine version
      description: |
        Please provide the exact SafeLine version.
        For nightly or custom builds, provide the image tag or commit ID.
      placeholder: "e.g. 9.4.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Please describe what happened and what you expected to happen.
      value: |
        What happened:

        What did you expect:
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce (if available)
      description: If you can reproduce the issue, list the minimum steps.
      value: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (optional)
      description: |
        Paste relevant logs or drag screenshots here.
        Please remove sensitive information before submitting.
      placeholder: |
        Paste logs or screenshots here.
